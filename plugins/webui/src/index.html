<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>boop</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main id="app">
      <header id="header">
        <h1>boop</h1>
        <span id="status" class="disconnected" title="disconnected">●</span>
      </header>
      <ol id="stream" aria-live="polite"></ol>
      <footer id="composer-bar">

            type="text"
            name="message"
            placeholder="say something"

          />

        </form>
      </footer>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
