<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `interactive-widget=resizes-content` makes the keyboard resize the layout viewport (and `dvh` units) instead of offsetting it, so `#app` shrinks to the visible area and the composer stays fixed with no outer scroll. Ignored by browsers that don't support it (current iOS), so it lands forward-compatibly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>boop</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./index.css" />
    <meta name="application-name" content="boop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="boop" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="theme-color" content="#1e3a8a" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <main id="app">
      <header id="header">
        <!-- The boop logo, scaled to fit the header next to the title. -->
        <img id="logo" src="./icon-512-maskable.png" alt="" />
        <h1>boop</h1>
        <!-- The connection dot, which doubles as the working indicator: a single dot at rest that splits into three orbiting dots while the agent is working (spiral out → spin → spiral back in). Color encodes the WebSocket connection state (green connected, red disconnected). -->
        <span id="status" class="disconnected" title="disconnected">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      </header>
      <ol id="stream" aria-live="polite"></ol>
      <footer id="composer-bar">
        <form id="composer" autocomplete="off">
          <input
            id="composer-input"
            type="text"
            name="message"
            placeholder="say something"
            disabled
          />
          <button id="composer-send" type="submit" disabled>send</button>
        </form>
      </footer>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
