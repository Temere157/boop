<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `interactive-widget=resizes-content` makes the keyboard resize the layout viewport (and `dvh` units) instead of offsetting it, so `#app` shrinks to the visible area and the composer stays fixed with no outer scroll. Ignored by browsers that don't support it (current iOS), so it lands forward-compatibly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>boop</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./index.css" />
    <meta name="application-name" content="boop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="boop" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="theme-color" content="#1e3a8a" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <main id="app">
      <header id="header">
        <!-- The boop logo, scaled to fit the header next to the title. -->
        <img id="logo" src="./icon-512-maskable.png" alt="" />
        <h1>boop</h1>
<!-- The connection dot, which doubles as the working indicator: a single dot at rest that splits into three orbiting dots while the agent is working (spiral out → spin → spiral back in).
        Color encodes the connection state: green connected, yellow idle (the idle timeout closed the connection, activity reconnects), red disconnected. -->
        <span id="status" class="disconnected" title="disconnected">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
        <!-- The notification toggle: enables browser (web push) notifications from boop, so the agent can reach this browser even when no tab is open. Disabled until connected; filled when notifications are on. -->
        <button
          id="notify"
          type="button"
          class="bell"
          disabled
          aria-pressed="false"
          title="notifications"
          aria-label="toggle notifications"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
      </header>
      <ol id="stream" aria-live="polite"></ol>
      <footer id="composer-bar">
        <form id="composer" autocomplete="off">
          <input
            id="composer-input"
            type="text"
            name="message"
            placeholder="say something"
          />
          <button id="composer-send" type="submit" disabled>send</button>
        </form>
      </footer>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
